<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Psikologi Kita</title>
    <meta name="description" content="Masuk ke akun Psikologi Kita untuk memulai konsultasi psikologi online bersama psikolog profesional.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-wrapper">
            <!-- LEFT SIDE - BRANDING -->
            <div class="auth-left">
                <div class="auth-brand">
                    <div class="brand-icon">
                        <i class="fas fa-brain"></i>
                    </div>
                    <h1>Psikologi Kita</h1>
                    <p>Kesehatan Mental Adalah Prioritas</p>
                </div>
                <div class="auth-benefits">
                    <div class="benefit-item">
                        <i class="fas fa-check-circle"></i>
                        <span>Konsultasi dengan Psikolog Profesional</span>
                    </div>
                    <div class="benefit-item">
                        <i class="fas fa-check-circle"></i>
                        <span>Rahasia & Aman Terjamin</span>
                    </div>
                    <div class="benefit-item">
                        <i class="fas fa-check-circle"></i>
                        <span>Layanan 24/7 Online</span>
                    </div>
                    <div class="benefit-item">
                        <i class="fas fa-check-circle"></i>
                        <span>Harga Terjangkau & Fleksibel</span>
                    </div>
                </div>
            </div>

            <!-- RIGHT SIDE - LOGIN FORM -->
            <div class="auth-right">
                <div class="auth-box">
                    <h2>Selamat Datang! 👋</h2>
                    <p class="auth-subtitle">Masuk ke akun Anda untuk melanjutkan konsultasi</p>

                    <form id="loginForm" class="auth-form" novalidate>
                        <div class="form-group">
                            <label for="email">Email / Nomor Pasien</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                placeholder="Masukkan email Anda"
                                required
                            >
                            <span class="error-message" id="emailError"></span>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="password-field">
                                <input 
                                    type="password" 
                                    id="password" 
                                    name="password" 
                                    placeholder="Masukkan password Anda"
                                    required
                                >
                                <button type="button" class="toggle-password" onclick="togglePassword()">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <span class="error-message" id="passwordError"></span>
                        </div>

                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox" name="remember">
                                <span>Ingat saya</span>
                            </label>
                            <a href="#" class="forgot-password">Lupa password?</a>
                        </div>

                        <button type="submit" class="auth-button">Masuk</button>
                    </form>

                    <div class="auth-divider">
                        <span>atau</span>
                    </div>

                    <button class="social-button google-btn">
                        <i class="fab fa-google"></i>
                        Masuk dengan Google
                    </button>

                    <div class="auth-footer">
                        <p>Belum punya akun? <a href="register.html">Daftar di sini</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
</body>
</html>
